# ORDO — minimal setup: one ORDO server (SQLite), Dex for login, Caddy with automatic
# HTTPS. Works at a station with internet and on a field server without it.
# See README.md in this folder.
name: ordo

services:
  ordo:
    build:
      context: ../../..
      dockerfile: deploy/Containerfile
    image: ordo:local
    environment:
      ORDO_SERVER_NAME: ${ORDO_DOMAIN:?set ORDO_DOMAIN in .env}
      ORDO_MASTER_KEY_FILE: /run/secrets/ordo_master_key
      # Login: ORDO talks only to the bundled Dex (ADR-0038, ADR-0039).
      ORDO_PUBLIC_URL: https://${ORDO_DOMAIN}
      ORDO_OIDC_ISSUER: https://${ORDO_DOMAIN}/dex
      ORDO_OIDC_CLIENT_ID: ordo
      ORDO_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # How long a device login lasts without re-verification (ADR-0040).
      ORDO_ACCESS_TIMEOUT_HOURS: ${ORDO_ACCESS_TIMEOUT_HOURS:-48}
      ORDO_ADMINS: ${ORDO_ADMINS:?set ORDO_ADMINS in .env}
      ORDO_GRAVATAR: ${ORDO_GRAVATAR:-on}
      ORDO_MAX_BLOB_MB: ${ORDO_MAX_BLOB_MB:-20}
      # Local accounts, managed in ORDO through Dex's API (ADR-0060); certificates from
      # `ordo generate-dex-certs`, see README.md.
      ORDO_DEX_API: https://dex:5557
      ORDO_DEX_API_CA_FILE: /dex-api/ca.pem
      ORDO_DEX_API_CERT_FILE: /dex-api/ordo.pem
      ORDO_DEX_API_KEY_FILE: /dex-api/ordo-key.pem
    secrets:
      - ordo_master_key
      - oidc_client_secret
    volumes:
      - ordo-data:/data
      - ./dex-api:/dex-api:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]

  # Identity provider: local accounts for very small organisations, or a bridge to the
  # organisation's own OpenID Connect provider (Microsoft Entra ID, Keycloak, …).
  # Reached at https://<domain>/dex.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      ORDO_DOMAIN: ${ORDO_DOMAIN}
      ORDO_OIDC_CLIENT_SECRET: ${ORDO_OIDC_CLIENT_SECRET:?set ORDO_OIDC_CLIENT_SECRET in .env}
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
      # The API for ORDO (port 5557, internal network only).
      - ./dex-api:/etc/dex/api:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    environment:
      ORDO_DOMAIN: ${ORDO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ordo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      internal:
        # Inside the network the domain leads to Caddy, so ORDO reaches the login at
        # https://<domain>/dex like the browsers do.
        aliases: ["${ORDO_DOMAIN}"]

secrets:
  ordo_master_key:
    file: ./master.key
  # A file, not the environment: Compose creates secrets from the environment only for
  # services that may write, and the ORDO container is read-only.
  oidc_client_secret:
    file: ./oidc-client-secret

volumes:
  ordo-data:
  dex-data:
  caddy-data:
  caddy-config:

networks:
  internal:
