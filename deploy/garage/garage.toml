# Garage (https://garagehq.deuxfleurs.fr, AGPL-3.0) as S3-compatible store for ORDO's
# attachments (ADR-0033): one node, for development, tests and small installations.
# The RPC secret comes from GARAGE_RPC_SECRET. For several nodes see Garage's manual.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
