[workspace]
resolver = "3"
members = [
  "platform/ordo-core",
  "platform/ordo-crypto",
  "platform/ordo-tokens",
  "platform/ordo-contracts",
  "platform/ordo-sync",
  "platform/ordo-server",
  "platform/ordo-app",
  "modules/units",
  "packages/med/patients",
  "tests/acceptance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["ORDO contributors"]
publish = false

[workspace.dependencies]
ordo-core = { path = "platform/ordo-core" }
ordo-contracts = { path = "platform/ordo-contracts" }
ordo-crypto = { path = "platform/ordo-crypto" }
ordo-sync = { path = "platform/ordo-sync" }
ordo-units = { path = "modules/units" }
ordo-med-patients = { path = "packages/med/patients" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
cedar-policy = { version = "4", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ciborium = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
percent-encoding = "2"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
zeroize = { version = "1", features = ["derive"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "BinaryType", "Blob", "CanvasRenderingContext2d", "CloseEvent", "Crypto", "Document", "DomTokenList",
  "File", "FileList", "History", "HtmlCanvasElement", "HtmlDialogElement", "HtmlElement",
  "HtmlInputElement", "ImageBitmap", "Location", "MessageEvent", "Navigator", "ScrollIntoViewOptions",
  "ScrollLogicalPosition", "Storage", "UrlSearchParams", "WebSocket", "Window",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-optimised profile for the WebAssembly app. Not stripped: wasm-bindgen and wasm-opt
# need the target-features section; wasm-opt removes what is not needed.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = false
