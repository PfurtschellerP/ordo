[workspace]
# The device storage worker has its own workspace (own lockfile): it links SQLite for the
# browser, which the server's SQLite (sqlx) cannot share yet (ADR-0034).
exclude = ["platform/ordo-store", "tests/fuzz"]
resolver = "3"
members = [
  "platform/ordo-core",
  "platform/ordo-crypto",
  "platform/ordo-tokens",
  "platform/ordo-profiles",
  "platform/ordo-contracts",
  "platform/ordo-sync",
  "platform/ordo-server",
  "platform/ordo-app",
  "modules/units",
  "modules/helpers",
  "modules/tasks",
  "modules/reports",
  "modules/command",
  "modules/map",
  "packages/med/patients",
  "tests/acceptance",
  "tests/load",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
# Where the source code is: the app links to it (LIC-1). A changed ORDO points to its own.
repository = "https://github.com/PfurtschellerP/ordo"
authors = ["ORDO contributors"]
publish = false

[workspace.dependencies]
ordo-core = { path = "platform/ordo-core" }
ordo-contracts = { path = "platform/ordo-contracts" }
ordo-crypto = { path = "platform/ordo-crypto" }
ordo-sync = { path = "platform/ordo-sync" }
ordo-units = { path = "modules/units" }
ordo-helpers = { path = "modules/helpers" }
# Reads QR codes of registration cards in the app (ADR-0072); without the image crate.
rqrr = { version = "0.11", default-features = false }
ordo-tasks = { path = "modules/tasks" }
ordo-reports = { path = "modules/reports" }
ordo-command = { path = "modules/command" }
ordo-map = { path = "modules/map" }
ordo-med-patients = { path = "packages/med/patients" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
blake3 = "1"
cedar-policy = { version = "4", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ciborium = "0.2"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
percent-encoding = "2"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
# IndexedDB for the device's storage key (ADR-0041).
idb = "0.6"
# OpenID Connect without its own HTTP client: ORDO's reqwest is handed to it (login.rs).
openidconnect = { version = "4", default-features = false }
# One HTTP client for the server, its tools and object_store: rustls with ring as crypto
# provider (no aws-lc), certificates checked against the system's store, so services with
# an organisation's own certificate authority work too. `query` for the address search.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Dex's gRPC API for local accounts (ADR-0060): tonic over rustls with ring, messages as
# hand-written prost structs (no protoc); bcrypt hashes for Dex; rcgen for the API's certificates.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = "0.14"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
bcrypt = "0.19"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
# Versioned schema migrations, embedded at build time (platform/ordo-server/migrations).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
zeroize = { version = "1", features = ["derive"] }
toml = "1"
# Map regions cut on the server (ADR-0057): read over HTTP or from a file, write PMTiles.
pmtiles = { version = "0.28", default-features = false, features = ["http-async", "file-async-tokio", "write"] }
# Attachments (ADR-0033): local directory now; S3-compatible stores with Garage later.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "ring", "reqwest"] }
toml_edit = "0.25"
time = { version = "0.3", features = ["std"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AesGcmParams", "AesKeyGenParams", "BinaryType", "Blob", "CanvasRenderingContext2d", "CloseEvent",
  "console", "Crypto", "CryptoKey", "Document", "DomTokenList",
  "File", "FileList", "History", "HtmlCanvasElement", "HtmlDialogElement", "HtmlElement",
  "Headers", "HtmlInputElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Request",
  "RequestInit", "Response", "ScrollIntoViewOptions",
  "ScrollLogicalPosition", "Storage", "SubtleCrypto", "UrlSearchParams", "WebSocket", "Window",
  "Worker", "WorkerOptions", "WorkerType",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-optimised profile for the WebAssembly app. Not stripped: wasm-bindgen and wasm-opt
# need the target-features section; wasm-opt removes what is not needed.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = false
