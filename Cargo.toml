[workspace]
resolver = "3"
members = [
  "platform/ordo-core",
  "platform/ordo-crypto",
  "platform/ordo-tokens",
  "platform/ordo-contracts",
  "platform/ordo-sync",
  "modules/units",
  "packages/med/patients",
  "acceptance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["ORDO contributors"]
publish = false

[workspace.dependencies]
ordo-core = { path = "platform/ordo-core" }
ordo-contracts = { path = "platform/ordo-contracts" }
ordo-crypto = { path = "platform/ordo-crypto" }
ordo-sync = { path = "platform/ordo-sync" }
ordo-units = { path = "modules/units" }
ordo-med-patients = { path = "packages/med/patients" }

blake3 = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ciborium = "0.2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-optimised profile for the WebAssembly app.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
