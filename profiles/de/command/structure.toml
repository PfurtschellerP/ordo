# Position kinds of the command structure (CMD-1, ADR-0031). The core meaning follows
# ISO 22320 (command, sector, staff, liaison); the German names follow FwDV 100 (3.2) and
# the medical response (Sanitätseinsatzleitung with LNA and OrgL, DIN 13050). The medical
# branch comes first; the general kinds are those of FwDV 100, so it fits into the whole
# tree. A state profile may replace this file (layering, architecture 8.8.3).

[[kind]]
id = "incident-command"
label = "Einsatzleitung"
core = "command"

