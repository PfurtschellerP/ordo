# ePCR forms of the DE profile (catalogue `epcr-forms`, module `med.epcr`, EPCR-2).
#
# The sections follow the structure of German emergency documentation (DIVI MIND:
# identification, history, findings, vital signs, measures, medication, disposition) and
# the needs of on-site care units at events and mass-casualty incidents. Which MIND
# version to align with in detail is an open question (docs/roadmap.md).
#
# Field types: text, longtext, number, choice, choices, date, time. `min`/`max` are
# input checks against typing errors, not clinical limits: ORDO never interprets values
# (EPCR-9). `code` maps a field to an open terminology for later exchange (EPCR-6):
# `fhir:` = HL7 FHIR element, `loinc:` = LOINC code.
#
# This material contains content from LOINC® (http://loinc.org). LOINC is copyright ©
# Regenstrief Institute, Inc. and the Logical Observation Identifiers Names and Codes
# (LOINC) Committee and is available at no cost under the license at
# http://loinc.org/license. LOINC® is a registered United States trademark of
# Regenstrief Institute, Inc.

format = 1

# ---------------------------------------------------------------------------
[[form]]
id = "identity"
label = "Personalien"
kind = "snapshot"

[[form.field]]
id = "family_name"
label = "Name"
type = "text"
code = "fhir:Patient.name.family"

[[form.field]]
id = "given_name"
label = "Vorname"
type = "text"
code = "fhir:Patient.name.given"

[[form.field]]
id = "birth_date"
label = "Geburtsdatum"
type = "date"
code = "fhir:Patient.birthDate"

[[form.field]]
id = "age_estimate"
label = "Alter, geschätzt"
type = "number"
unit = "Jahre"
min = 0
max = 120
hint = "Wenn das Geburtsdatum nicht bekannt ist"

[[form.field]]
id = "sex"
label = "Geschlecht"
type = "choice"
code = "fhir:Patient.gender"
option = [
  { id = "female", label = "weiblich" },
  { id = "male", label = "männlich" },
  { id = "other", label = "divers" },
  { id = "unknown", label = "unbekannt" },
]

[[form.field]]
id = "features"
label = "Erkennungsmerkmale"
type = "longtext"
hint = "Kleidung, Statur, Haare, Brille, Tätowierungen – hilft bei unbekannten Patienten"

[[form.field]]
id = "language"
label = "Sprache, Verständigung"
type = "text"
code = "fhir:Patient.communication.language"
hint = "z. B. Deutsch, Englisch, Gebärdensprache, Dolmetscher nötig"

[[form.field]]
id = "address"
label = "Anschrift"
type = "longtext"
code = "fhir:Patient.address"

[[form.field]]
id = "phone"
label = "Telefon"
type = "text"
code = "fhir:Patient.telecom"

[[form.field]]
id = "contact"
label = "Angehörige, Kontaktperson"
type = "longtext"
code = "fhir:Patient.contact"

[[form.field]]
id = "belongings"
label = "Wertsachen, Habseligkeiten"
type = "longtext"

# ---------------------------------------------------------------------------
[[form]]
id = "encounter"
label = "Einsatz und Auffinden"
kind = "snapshot"

[[form.field]]
id = "found_location"
label = "Auffindeort"
type = "text"

[[form.field]]
id = "found_time"
label = "Auffindezeit"
type = "time"

[[form.field]]
id = "arrival_time"
label = "Ankunft in der UHS"
type = "time"

[[form.field]]
id = "brought_by"
label = "Gebracht durch"
type = "choice"
option = [
  { id = "self", label = "selbst gekommen" },
  { id = "companion", label = "Begleitperson" },
  { id = "medic_team", label = "Sanitätstrupp" },
  { id = "ems", label = "Rettungsdienst" },
  { id = "police", label = "Polizei" },
  { id = "security", label = "Ordnungsdienst" },
  { id = "other", label = "sonstige" },
]

[[form.field]]
id = "emergency_type"
label = "Art des Notfalls"
type = "choices"
option = [
  { id = "injury", label = "Verletzung" },
  { id = "illness", label = "Erkrankung" },
  { id = "intoxication", label = "Vergiftung, Alkohol, Drogen" },
  { id = "heat", label = "Hitze, Sonne" },
  { id = "cold", label = "Kälte" },
  { id = "psychological", label = "psychische Ausnahmesituation" },
  { id = "other", label = "sonstiges" },
]

[[form.field]]
id = "mechanism"
label = "Ereignis, Unfallhergang"
type = "longtext"

# ---------------------------------------------------------------------------
[[form]]
id = "history"
label = "Anamnese"
kind = "snapshot"

[[form.field]]
id = "complaint"
label = "Beschwerden"
type = "longtext"

[[form.field]]
id = "onset"
label = "Beginn der Beschwerden"
type = "text"
hint = "Uhrzeit oder „seit …“"

[[form.field]]
id = "allergies"
label = "Allergien"
type = "text"
hint = "„keine bekannt“ ausdrücklich eintragen"
code = "fhir:AllergyIntolerance"

[[form.field]]
id = "medication"
label = "Dauermedikation"
type = "longtext"
code = "fhir:MedicationStatement"

[[form.field]]
id = "conditions"
label = "Vorerkrankungen"
type = "longtext"
code = "fhir:Condition"

[[form.field]]
id = "last_intake"
label = "Letzte Nahrungs- und Flüssigkeitsaufnahme"
type = "text"

[[form.field]]
id = "substances"
label = "Alkohol, Drogen"
type = "text"

[[form.field]]
id = "pregnancy"
label = "Schwangerschaft"
type = "choice"
option = [
  { id = "no", label = "nein" },
  { id = "yes", label = "ja" },
  { id = "unknown", label = "unbekannt" },
]

# ---------------------------------------------------------------------------
[[form]]
id = "vitals"
label = "Vitalwerte"
kind = "series"

[[form.field]]
id = "time"
label = "Uhrzeit"
type = "time"

[[form.field]]
id = "heart_rate"
label = "Herzfrequenz"
type = "number"
unit = "/min"
min = 0
max = 300
code = "loinc:8867-4"

[[form.field]]
id = "bp_systolic"
label = "Blutdruck systolisch"
type = "number"
unit = "mmHg"
min = 0
max = 300
code = "loinc:8480-6"

[[form.field]]
id = "bp_diastolic"
label = "Blutdruck diastolisch"
type = "number"
unit = "mmHg"
min = 0
max = 250
code = "loinc:8462-4"

[[form.field]]
id = "resp_rate"
label = "Atemfrequenz"
type = "number"
unit = "/min"
min = 0
max = 80
code = "loinc:9279-1"

[[form.field]]
id = "spo2"
label = "SpO₂"
type = "number"
unit = "%"
min = 0
max = 100
code = "loinc:59408-5"

[[form.field]]
id = "temperature"
label = "Temperatur"
type = "number"
unit = "°C"
min = 20
max = 45
code = "loinc:8310-5"

[[form.field]]
id = "glucose"
label = "Blutzucker"
type = "number"
unit = "mg/dl"
min = 0
max = 1000
code = "loinc:2339-0"

[[form.field]]
id = "etco2"
label = "etCO₂"
type = "number"
unit = "mmHg"
min = 0
max = 150
code = "loinc:19889-5"

[[form.field]]
id = "gcs_eye"
label = "GCS Augen öffnen"
type = "number"
min = 1
max = 4
code = "loinc:9267-6"
hint = "1–4"

[[form.field]]
id = "gcs_verbal"
label = "GCS verbale Reaktion"
type = "number"
min = 1
max = 5
code = "loinc:9270-0"
hint = "1–5"

[[form.field]]
id = "gcs_motor"
label = "GCS motorische Reaktion"
type = "number"
min = 1
max = 6
code = "loinc:9268-4"
hint = "1–6"

[[form.field]]
id = "pain"
label = "Schmerz (NRS)"
type = "number"
min = 0
max = 10
code = "loinc:72514-3"
hint = "0–10"

[[form.sum]]
id = "gcs"
label = "GCS gesamt"
of = ["gcs_eye", "gcs_verbal", "gcs_motor"]
code = "loinc:9269-2"

# ---------------------------------------------------------------------------
