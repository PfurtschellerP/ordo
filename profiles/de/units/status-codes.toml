# Status codes of units (FMS/TMS status, Fahrzeugstatus): code, German label, an English
# name for the command palette's search, and the group the incident command sees the unit
# in (UNIT-10, ADR-0099): available (free for a new task, TRANS-4), task, transport or
# unavailable. Prototype subset of the FMS codes 0–9.

[[status]]
code = "1"
label = "Einsatzbereit über Funk"
name = "available radio"
group = "available"

[[status]]
code = "2"
label = "Einsatzbereit auf Wache"
name = "available station"
group = "available"

[[status]]
code = "3"
label = "Einsatz übernommen"
name = "en route"
group = "task"

[[status]]
code = "4"
label = "Am Einsatzort"
name = "on scene"
group = "task"

[[status]]
code = "6"
label = "Nicht einsatzbereit"
name = "unavailable"
group = "unavailable"

[[status]]
code = "7"
label = "Patient aufgenommen"
name = "transporting patient"
group = "transport"

[[status]]
code = "8"
label = "Am Transportziel"
name = "at destination"
group = "transport"
