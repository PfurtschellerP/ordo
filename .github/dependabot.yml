# Weekly updates, each release at least 7 days old (cooldown), so a compromised release is
# more likely found and pulled before it reaches ORDO (docs/dependencies.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /platform/ordo-store
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      storage-worker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /deploy/compose/minimal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tools/symbols
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /tests/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
