name: Vendored libraries

# Weekly check whether the JavaScript libraries and typefaces the web app vendors have
# newer versions on npm (Dependabot cannot see them, docs/dependencies.md). Findings go
# into one open issue, updated each week.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TITLE: "Vendored libraries behind"

jobs:
  watch:
    name: Watch vendored libraries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with npm
        id: watch
        run: |
          set +e
          tools/vendored/check.sh > report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - name: Close the issue when everything is current
        if: steps.watch.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All vendored libraries current on $(date -u +%F)."
          fi
      - name: Open or update the issue
        if: steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly check of $(date -u +%F). Update the version in the script, run it, review the diff and the release notes."
            echo
            cat report.md
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
