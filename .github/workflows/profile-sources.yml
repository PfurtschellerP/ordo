name: Profile sources

# Weekly check whether the documents the regional profiles are based on changed or moved
# (docs/standards-de-states.md). Findings go into one open issue, updated each week.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TITLE: "Profile sources changed"

jobs:
  watch:
    name: Watch profile sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch every source and compare
        id: watch
        run: |
          set +e
          cargo run --locked -p ordo-profiles -- watch --report report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - name: Close the review issue when everything is confirmed
        if: steps.watch.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All sources unchanged on $(date -u +%F)."
          fi
      - name: Open or update the review issue
        if: steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly check of $(date -u +%F)."
            echo
            cat report.md
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
