name: Container

# Builds the server image and smoke-tests it. Runs only when the image can change,
# to save CI minutes; weekly as well, to notice base-image or toolchain problems.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "tests/tls/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "tests/tls/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    name: Container image (build and smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f deploy/Containerfile -t ordo:ci .
      - name: Start a container
        run: |
          docker run --rm --entrypoint /usr/local/bin/ordo ordo:ci generate-key > "$RUNNER_TEMP/master.key"
          chmod 644 "$RUNNER_TEMP/master.key"
          docker run -d --name ordo --read-only -p 8080:8080 \
            -e ORDO_SERVER_NAME=localhost \
            -e ORDO_MASTER_KEY_FILE=/run/master.key \
            -v "$RUNNER_TEMP/master.key:/run/master.key:ro" \
            ordo:ci
      - name: Check health, readiness, metrics and user
        run: |
          for i in $(seq 30); do curl -fsS http://localhost:8080/readyz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/metrics | grep -q '^ordo_sessions 0$'
          test "$(docker inspect --format '{{.Config.User}}' ordo:ci)" = "65532:65532"
          for i in $(seq 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' ordo)" = healthy ] && break; sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' ordo)" = healthy
          echo "Image size: $(docker image inspect --format '{{.Size}}' ordo:ci | numfmt --to=iec)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the Compose bundle (configuration and Dex template)
        working-directory: deploy/compose/minimal
        env:
          ORDO_DOMAIN: localhost
          ORDO_OIDC_CLIENT_SECRET: ci-secret
          ORDO_ADMINS: dora
        run: |
          docker compose config -q
          sed -e 's|replace with a bcrypt hash|$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W|' \
              -e 's|replace with a random UUID|00000000-0000-4000-8000-000000000001|' \
              dex.yaml.example > "$RUNNER_TEMP/dex.yaml"
          image=$(sed -n 's/^ *image: \(ghcr.io\/dexidp\/dex:.*\)$/\1/p' compose.yaml)
          docker run -d --name dex -p 5556:5556 -e ORDO_DOMAIN -e ORDO_OIDC_CLIENT_SECRET \
            -v "$RUNNER_TEMP/dex.yaml:/etc/dex/config.yaml:ro" "$image" dex serve /etc/dex/config.yaml
          for i in $(seq 30); do
            curl -fsS http://localhost:5556/dex/.well-known/openid-configuration > "$RUNNER_TEMP/discovery.json" && break; sleep 1
          done
          jq -e '.issuer == "https://localhost/dex" and (.grant_types_supported | index("urn:ietf:params:oauth:grant-type:device_code"))' "$RUNNER_TEMP/discovery.json"
      # The bundle's TLS endpoint agrees on the hybrid post-quantum key exchange (ADR-0042).
      - name: Check the hybrid post-quantum TLS key exchange
        working-directory: deploy/compose/minimal
        run: |
          set -o pipefail
          caddy=$(sed -n 's/^ *image: \(docker.io\/library\/caddy:.*\)$/\1/p' compose.yaml)
          docker run -d --name caddy -p 8443:443 -e ORDO_DOMAIN=localhost \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy"
          for i in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null && break; sleep 1
          done
          docker run --rm --network host -v "$GITHUB_WORKSPACE/tests/tls:/t:ro" \
            docker.io/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f \
            sh -c "apk add -q openssl python3 && python3 /t/check_hybrid_tls.py localhost:8443" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: |
          docker logs ordo || true
          docker logs dex || true
          docker logs caddy || true

