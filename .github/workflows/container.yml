name: Container

# Builds the server image and smoke-tests it. Runs only when the image can change,
# to save CI minutes; weekly as well, to notice base-image or toolchain problems.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "tests/tls/**"
      - "tests/sbom/**"
      - "tests/container/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "tests/tls/**"
      - "tests/sbom/**"
      - "tests/container/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    name: Container image (build and smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f deploy/Containerfile -t ordo:ci .
      - name: Smoke test (start read-only, health, readiness, metrics, user)
        run: tests/container/smoke.sh ordo:ci | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the Compose bundle (configuration and Dex template)
        working-directory: deploy/compose/minimal
        env:
          ORDO_DOMAIN: localhost
          ORDO_OIDC_CLIENT_SECRET: ci-secret
          ORDO_ADMINS: dora
        run: |
          docker compose config -q
          cp dex.yaml.example "$RUNNER_TEMP/dex.yaml"
          # Certificates for Dex's API as the README makes them (ADR-0060), with the image.
          mkdir -p "$RUNNER_TEMP/dex-api" && chmod 777 "$RUNNER_TEMP/dex-api"
          docker run --rm -v "$RUNNER_TEMP/dex-api:/certs" ordo:ci generate-dex-certs /certs dex localhost
          sudo chmod 644 "$RUNNER_TEMP"/dex-api/*.pem
          image=$(sed -n 's/^ *image: \(ghcr.io\/dexidp\/dex:.*\)$/\1/p' compose.yaml)
          docker run -d --name dex -p 5556:5556 -p 5557:5557 -e ORDO_DOMAIN -e ORDO_OIDC_CLIENT_SECRET \
            -v "$RUNNER_TEMP/dex.yaml:/etc/dex/config.yaml:ro" -v "$RUNNER_TEMP/dex-api:/etc/dex/api:ro" \
            "$image" dex serve /etc/dex/config.yaml
          for _ in $(seq 30); do
            curl -fsS http://localhost:5556/dex/.well-known/openid-configuration > "$RUNNER_TEMP/discovery.json" && break; sleep 1
          done
          jq -e '.issuer == "https://localhost/dex" and (.grant_types_supported | index("urn:ietf:params:oauth:grant-type:device_code"))' "$RUNNER_TEMP/discovery.json"
          # The API speaks TLS with a certificate of the installation's CA (generate-dex-certs).
          d="$RUNNER_TEMP/dex-api"
          openssl s_client -connect localhost:5557 -CAfile "$d/ca.pem" -cert "$d/ordo.pem" -key "$d/ordo-key.pem" \
            -verify_return_error -brief < /dev/null 2>&1 | tee "$RUNNER_TEMP/api.txt"
          grep -q "Verification: OK" "$RUNNER_TEMP/api.txt"
      # The bundle's TLS endpoint agrees on the hybrid post-quantum key exchange (ADR-0042).
      - name: Check the hybrid post-quantum TLS key exchange
        working-directory: deploy/compose/minimal
        run: |
          set -o pipefail
          caddy=$(sed -n 's/^ *image: \(docker.io\/library\/caddy:.*\)$/\1/p' compose.yaml)
          docker run -d --name caddy -p 8443:443 -e ORDO_DOMAIN=localhost \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy"
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null && break; sleep 1
          done
          docker run --rm --network host -v "$GITHUB_WORKSPACE/tests/tls:/t:ro" \
            docker.io/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f \
            sh -c "apk add -q openssl python3 && python3 /t/check_hybrid_tls.py localhost:8443" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Software bills of materials of what ships: server and web app (ADR-0043).
      - name: Software bills of materials (CycloneDX)
        run: |
          set -o pipefail
          cargo install --locked cargo-cyclonedx@0.5.10
          mkdir -p "$RUNNER_TEMP/sbom"
          for crate in ordo-server ordo-app; do
            dir=$(cargo metadata --format-version 1 --no-deps | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .manifest_path' | xargs dirname)
            cargo cyclonedx --format json --spec-version 1.6 --manifest-path "$dir/Cargo.toml"
            cp "$dir/$crate.cdx.json" "$RUNNER_TEMP/sbom/"
          done
          python3 tests/sbom/check_sbom.py "$RUNNER_TEMP/sbom/ordo-server.cdx.json" ordo-server \
            ed25519-dalek chacha20poly1305 blake3 rustls | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tests/sbom/check_sbom.py "$RUNNER_TEMP/sbom/ordo-app.cdx.json" ordo-app \
            leptos ed25519-dalek | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the bills of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
      - name: Container logs
        if: always()
        run: |
          docker logs dex || true
          docker logs caddy || true

  # The image is published for arm64 too (OPS-5): built natively on an arm64 runner, no
  # emulation, and smoke-tested the same way.
  container-arm64:
    name: Container image arm64 (build and smoke test)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f deploy/Containerfile -t ordo:ci .
      - name: Smoke test (start read-only, health, readiness, metrics, user)
        run: tests/container/smoke.sh ordo:ci | tee -a "$GITHUB_STEP_SUMMARY"
