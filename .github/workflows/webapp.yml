name: Web app

# Builds the Leptos app with Trunk and runs the end-to-end UI scenario
# (tests/e2e/scenario.spec.ts, Playwright) in Firefox, Chromium and WebKit against a real
# `ordo serve`.
on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "profiles/**"
      - "design/**"
      - "tests/e2e/**"
      - "tools/symbols/**"
      - "tools/notices/**"
      - "about.toml"
      - "LICENSES/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - "profiles/**"
      - "design/**"
      - "tests/e2e/**"
      - "tools/symbols/**"
      - "tools/notices/**"
      - "about.toml"
      - "LICENSES/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  webapp:
    name: Build app and run UI scenario
    runs-on: ubuntu-24.04
    # A normal run takes about a quarter of an hour; a hanging download must not hold
    # the runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Trunk and the matching wasm-bindgen
        run: |
          WASM_BINDGEN=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install --locked trunk --version 0.22.1
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN"
      - name: Install cargo-about (licence notices, ADR-0055)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - name: Build the app
        working-directory: platform/ordo-app
        env:
          # The notices are required here, and the page links to this commit's source.
          ORDO_NOTICES_REQUIRED: "1"
          ORDO_COMMIT: ${{ github.sha }}
        run: trunk build --release
      - name: Build the server
        run: cargo build --locked -p ordo-server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            tools/symbols/package-lock.json
      - name: Tactical symbols match their generator (MAP-3)
        working-directory: tools/symbols
        run: |
          npm ci
          npm run check
      - name: Install Playwright and the browsers
        working-directory: tests/e2e
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install --with-deps firefox chromium webkit
          docker pull ghcr.io/dexidp/dex:v2.46.1   # identity provider of the tests
      - name: Start Garage for the attachments (S3-compatible store, ADR-0033)
        run: |
          docker run -d --name garage -p 127.0.0.1:3900:3900 \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -v "$PWD/deploy/garage/garage.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
          key="GK$(openssl rand -hex 12)"; secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          deploy/garage/setup.sh "docker exec garage /garage" ordo "$key" "$secret"
          printf %s "$secret" > "$RUNNER_TEMP/s3-secret"
          {
            echo "ORDO_S3_ENDPOINT=http://127.0.0.1:3900"
            echo "ORDO_S3_BUCKET=ordo"
            echo "ORDO_S3_ACCESS_KEY_ID=$key"
            echo "ORDO_S3_SECRET_ACCESS_KEY_FILE=$RUNNER_TEMP/s3-secret"
          } >> "$GITHUB_ENV"
      - name: Run the UI scenario in Firefox, Chromium and WebKit (attachments in Garage)
        working-directory: tests/e2e
        env:
          ORDO_E2E_SHOTS: ${{ runner.temp }}/ui
          ORDO_E2E_WORK: ${{ runner.temp }}/work
        run: npx playwright test
      - name: Bundle size to the job summary
        if: always()
        run: |
          {
            echo "## Web app bundle"
            for f in platform/ordo-app/dist/*.wasm platform/ordo-app/dist/*.js platform/ordo-app/dist/*.css; do
              [ -f "$f" ] && echo "- $(basename "$f"): $(stat -c %s "$f" | numfmt --to=iec) raw, $(gzip -9c "$f" | wc -c | numfmt --to=iec) gzip"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: |
            ${{ runner.temp }}/ui/
            ${{ runner.temp }}/work/*/server.log
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
