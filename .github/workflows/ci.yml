name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start Garage, an S3-compatible store, for the attachment test (ADR-0033)
        run: |
          docker run -d --name garage -p 127.0.0.1:3900:3900 \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -v "$PWD/deploy/garage/garage.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
          key="GK$(openssl rand -hex 12)"; secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          deploy/garage/setup.sh "docker exec garage /garage" ordo "$key" "$secret"
          {
            echo "ORDO_TEST_S3_ENDPOINT=http://127.0.0.1:3900"
            echo "ORDO_TEST_S3_BUCKET=ordo"
            echo "ORDO_TEST_S3_ACCESS_KEY_ID=$key"
            echo "ORDO_TEST_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build client-side crates for WebAssembly
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p ordo-core -p ordo-crypto -p ordo-sync -p ordo-contracts -p ordo-units -p ordo-med-patients

  profiles:
    name: Regional profiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check regional profiles and their source register
        run: >-
          cargo run --locked -p ordo-profiles -- check
          --register docs/standards-de-states.md --parent de

  design:
    name: Design tokens and contrast (WCAG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check tokens and contrast, build CSS
        run: cargo run --locked -p ordo-tokens -- build --out target/design
      - name: Publish contrast report to the job summary
        if: always()
        run: |
          if [ -f target/design/contrast-report.md ]; then
            cat target/design/contrast-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  traceability:
    name: Requirements tracing (OpenFastTrace)
    runs-on: ubuntu-24.04
    env:
      OFT_VERSION: 4.11.0
      OFT_SHA256: f094cd314f0fc4236f513f66fb39260a16f72e2320beb6b4fdeb7940b9b8cf87
      # Milestones traced so far; see docs/requirements/README.md
      MILESTONES: m0,m1,m2,m3,m4,m5,m6,m7,m8,m9,m10,m11,m12,m13,m14,m15,m16,m17,m18,m19,m20,m21,m22,m23,m24,m25,m26,m27,m28,m29,m30,m31,m32,m33,m34,m35,m36,m37,m38,m39,m40,m41,m42,m43,m44,m45,m46,m47,m48,m49,m50,m51,m52,m53
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download OpenFastTrace and verify its checksum
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/oft.jar" \
            "https://github.com/itsallcode/openfasttrace/releases/download/${OFT_VERSION}/openfasttrace-${OFT_VERSION}.jar"
          echo "${OFT_SHA256}  $RUNNER_TEMP/oft.jar" | sha256sum --check
      - name: Trace requirements of the milestones
        run: |
          set -o pipefail
          java -version
          java -jar "$RUNNER_TEMP/oft.jar" trace -t "_,${MILESTONES}" docs platform modules packages tests | tee "$RUNNER_TEMP/trace.txt"
      - name: Publish trace to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/trace.txt" ]; then
            { echo '## Requirements tracing'; echo '```'; cat "$RUNNER_TEMP/trace.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  licences:
    name: Licences (REUSE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  dependencies:
    name: Dependencies (licences, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Device storage worker (own workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: platform/ordo-store/Cargo.toml
          arguments: --all-features
      # Dependencies no code uses any more (deliberate ones are listed per crate).
      - name: Unused dependencies (cargo-machete)
        run: |
          cargo install --locked cargo-machete --version 0.9.1
          cargo machete --with-metadata

  storage-worker:
    name: Device storage worker (format, lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/ordo-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: platform/ordo-store
      - name: Format
        run: cargo fmt --check
      - name: Clippy for WebAssembly (SQLite is compiled with clang)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
