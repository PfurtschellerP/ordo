name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build client-side crates for WebAssembly
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p ordo-core -p ordo-crypto -p ordo-sync -p ordo-contracts -p ordo-units -p ordo-med-patients

  design:
    name: Design tokens and contrast (WCAG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check tokens and contrast, build CSS
        run: cargo run --locked -p ordo-tokens -- build --out target/design
      - name: Publish contrast report to the job summary
        if: always()
        run: |
          if [ -f target/design/contrast-report.md ]; then
            cat target/design/contrast-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  traceability:
    name: Requirements tracing (OpenFastTrace)
    runs-on: ubuntu-24.04
    env:
      OFT_VERSION: 4.11.0
      OFT_SHA256: f094cd314f0fc4236f513f66fb39260a16f72e2320beb6b4fdeb7940b9b8cf87
      # Milestones traced so far; see docs/requirements/README.md
      MILESTONES: m0,m1,m2,m3,m4,m5,m6,m7,m8,m9,m10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download OpenFastTrace and verify its checksum
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/oft.jar" \
            "https://github.com/itsallcode/openfasttrace/releases/download/${OFT_VERSION}/openfasttrace-${OFT_VERSION}.jar"
          echo "${OFT_SHA256}  $RUNNER_TEMP/oft.jar" | sha256sum --check
      - name: Trace requirements of the milestones
        run: |
          set -o pipefail
          java -version
          java -jar "$RUNNER_TEMP/oft.jar" trace -t "_,${MILESTONES}" docs platform modules packages tests | tee "$RUNNER_TEMP/trace.txt"
      - name: Publish trace to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/trace.txt" ]; then
            { echo '## Requirements tracing'; echo '```'; cat "$RUNNER_TEMP/trace.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  licences:
    name: Licences (REUSE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  dependencies:
    name: Dependencies (licences, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
