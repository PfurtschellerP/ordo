name: Release

# Builds a release from a version tag (v1.2.3), only in CI (ADR-0043, SEC-16):
# - the server image in GitHub's container registry, for linux/amd64 and linux/arm64 (each
#   built natively), signed keyless with cosign
#   (Sigstore), with SLSA build provenance and its CycloneDX bill of materials as
#   attestations;
# - the web app as an archive, with provenance and bill of materials;
# - both bills of materials and the archive attached to a GitHub release.
# How operators verify a release: docs/architecture/07-deployment-view.md, 7.6.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CYCLONEDX_VERSION: 0.5.10

jobs:
  # One image per architecture (OPS-5), each built natively (no emulation), smoke-tested
  # and pushed by digest; the job below joins them into one multi-architecture image.
  image-build:
    name: Server image ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lower case, as the registry needs it)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/${{ matrix.arch }}
          # The app's notices link to the source of exactly this build (LIC-1).
          build-args: ORDO_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and bill of materials are attested on the joined image, with Sigstore.
          provenance: false
          sbom: false
      - name: Smoke test of the pushed image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          tests/container/smoke.sh "$IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remember the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image:
    name: Server image (multi-architecture, signed, with provenance and bill of materials)
    needs: image-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lower case, as the registry needs it)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Join the architectures into one image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test "$(find . -type f | wc -l)" = 2
          # shellcheck disable=SC2046 # one -t per tag, one reference per architecture
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$IMAGE@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image and each architecture (keyless)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Bill of materials of the server
        run: |
          cargo install --locked "cargo-cyclonedx@$CYCLONEDX_VERSION"
          cargo cyclonedx --format json --spec-version 1.6 --manifest-path platform/ordo-server/Cargo.toml
          python3 tests/sbom/check_sbom.py platform/ordo-server/ordo-server.cdx.json ordo-server \
            ed25519-dalek chacha20poly1305 blake3 rustls
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: platform/ordo-server/ordo-server.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server
          path: platform/ordo-server/ordo-server.cdx.json
      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          echo "Image: \`$IMAGE@$DIGEST\` (linux/amd64 and linux/arm64; signed, provenance, bill of materials)" >> "$GITHUB_STEP_SUMMARY"

  webapp:
    name: Web app archive (with provenance and bill of materials)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Trunk and the matching wasm-bindgen
        run: |
          WASM_BINDGEN=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install --locked trunk --version 0.22.1
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN"
      - name: Install cargo-about (licence notices, ADR-0055)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - name: Build the app
        working-directory: platform/ordo-app
        env:
          # The notices are required here, and the page links to this commit's source.
          ORDO_NOTICES_REQUIRED: "1"
          ORDO_COMMIT: ${{ github.sha }}
        run: trunk build --release
      - name: Archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          tar -C platform/ordo-app/dist -czf "$RUNNER_TEMP/release/ordo-app-$TAG.tar.gz" .
      - name: Bill of materials of the web app
        run: |
          cargo install --locked "cargo-cyclonedx@$CYCLONEDX_VERSION"
          cargo cyclonedx --format json --spec-version 1.6 --manifest-path platform/ordo-app/Cargo.toml
          python3 tests/sbom/check_sbom.py platform/ordo-app/ordo-app.cdx.json ordo-app leptos ed25519-dalek
          cp platform/ordo-app/ordo-app.cdx.json "$RUNNER_TEMP/release/"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/ordo-app-*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/release/ordo-app-*.tar.gz
          sbom-path: platform/ordo-app/ordo-app.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webapp
          path: ${{ runner.temp }}/release/

  publish:
    name: GitHub release
    needs: [image, webapp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "ORDO $TAG"
