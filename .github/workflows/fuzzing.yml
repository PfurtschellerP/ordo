name: Fuzzing

# Fuzzes the decoders of everything from the network with ClusterFuzzLite (SEC-17,
# ADR-0059): a short run on every change, a longer one every day that grows the corpus.
# A crash fails the run; the input that caused it is kept as an artifact.
on:
  push:
    branches: [main]
    paths:
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - ".github/workflows/fuzzing.yml"
  pull_request:
    paths:
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - "platform/**"
      - "modules/**"
      - "packages/**"
      - ".github/workflows/fuzzing.yml"
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ github.event_name == 'schedule' && 'daily batch' || 'on change' }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Findings as SARIF in the repository's code scanning.
      security-events: write
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          # Pull requests: what the change touches; otherwise every target, the corpus
          # kept between runs.
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && 1800 || 300 }}
          output-sarif: true
