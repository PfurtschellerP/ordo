# Licence notices of the shipped Rust crates (LIC-1, ADR-0055), made by cargo-about
# (tools/notices.sh). Accepts the same licences as deny.toml.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The server (Linux) and the web app (WebAssembly).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]
# Not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# cargo-about's known fixes for crates whose licence files it cannot read alone.
workarounds = ["ring", "rustls"]
# ORDO's own crates are AGPL-3.0-or-later; the page says so itself.
private = { ignore = true }
