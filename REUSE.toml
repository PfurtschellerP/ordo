# Licensing of this repository, following the REUSE specification
# (https://reuse.software). If several annotations match a file, the last one wins.
version = 1
SPDX-PackageName = "ORDO"

# Default: all code and everything else is AGPL-3.0-or-later.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation is CC BY 4.0.
[[annotations]]
path = ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", "SECURITY.md", "design/README.md"]
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Open specifications: texts are CC BY 4.0 ...
[[annotations]]
path = "spec/**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# ... schemas (OpenAPI, AsyncAPI, CDDL, JSON Schema) are Apache-2.0 ...
[[annotations]]
path = [
  "spec/**/*.yaml",
  "spec/**/*.yml",
  "spec/**/*.json",
  "spec/**/*.cddl",
]
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "Apache-2.0"

# ... and so is the conformance test suite, as a whole.
[[annotations]]
path = "spec/conformance/**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "Apache-2.0"

# Icons from Lucide 1.70.0 (lucide-static), ISC; see design/assets/icons/lucide/LICENSE.
[[annotations]]
path = "design/assets/icons/lucide/**"
SPDX-FileCopyrightText = "Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# ... except icons derived from Feather, which are also MIT.
[[annotations]]
path = "design/assets/icons/lucide/search.svg"
SPDX-FileCopyrightText = ["Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# Map libraries, vendored from npm (ADR-0006, ADR-0064): MapLibre GL JS, PMTiles, Protomaps
# basemap, Terra Draw.
[[annotations]]
path = ["platform/ordo-app/map/vendor/maplibre-gl*"]
SPDX-FileCopyrightText = "2023 MapLibre contributors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["platform/ordo-app/map/vendor/pmtiles.*", "platform/ordo-app/map/vendor/basemaps.*"]
SPDX-FileCopyrightText = "Protomaps LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# Terra Draw and its MapLibre adapter, for reshaping drawings (ADR-0064).
[[annotations]]
path = ["platform/ordo-app/map/vendor/terra-draw*"]
SPDX-FileCopyrightText = "2022 James Milner"
SPDX-License-Identifier = "MIT"

# Label fonts for the map (Noto Sans glyphs from Protomaps' basemap assets).
[[annotations]]
path = ["platform/ordo-app/map/glyphs/**"]
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts)"
SPDX-License-Identifier = "OFL-1.1"

# Tactical symbols of the DE profile, drawn by @taktische-zeichen/core (tools/symbols, MAP-3).
[[annotations]]
path = ["profiles/de/symbols/*.svg"]
SPDX-FileCopyrightText = "2022-2026 Philipp Jardas"
SPDX-License-Identifier = "MIT"

# Typefaces of the design tokens, vendored from Fontsource (platform/ordo-app/vendor-fonts.sh).
[[annotations]]
path = ["platform/ordo-app/fonts/atkinson-hyperlegible-next-*", "platform/ordo-app/fonts/OFL-atkinson-hyperlegible-next.txt"]
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["platform/ordo-app/fonts/atkinson-hyperlegible-mono-*", "platform/ordo-app/fonts/OFL-atkinson-hyperlegible-mono.txt"]
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Mono Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next-mono)"
SPDX-License-Identifier = "OFL-1.1"
