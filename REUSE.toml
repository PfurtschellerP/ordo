# Licensing of this repository, following the REUSE specification
# (https://reuse.software). If several annotations match a file, the last one wins.
version = 1
SPDX-PackageName = "ORDO"

# Default: all code and everything else is AGPL-3.0-or-later.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation is CC BY 4.0.
[[annotations]]
path = ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", "SECURITY.md", "design/README.md"]
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Open specifications: texts are CC BY 4.0 ...
[[annotations]]
path = "spec/**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# ... schemas (OpenAPI, AsyncAPI, CDDL, JSON Schema) are Apache-2.0 ...
[[annotations]]
path = [
  "spec/**/*.yaml",
  "spec/**/*.yml",
  "spec/**/*.json",
  "spec/**/*.cddl",
]
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "Apache-2.0"

# ... and so is the conformance test suite, as a whole.
[[annotations]]
path = "spec/conformance/**"
SPDX-FileCopyrightText = "ORDO contributors"
SPDX-License-Identifier = "Apache-2.0"

# Icons from Lucide 1.70.0 (lucide-static), ISC; see design/assets/icons/lucide/LICENSE.
[[annotations]]
path = "design/assets/icons/lucide/**"
SPDX-FileCopyrightText = "Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# ... except icons derived from Feather, which are also MIT.
[[annotations]]
path = "design/assets/icons/lucide/search.svg"
SPDX-FileCopyrightText = ["Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"
