# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on known security vulnerabilities and on yanked crates.
version = 2
yanked = "deny"
ignore = [
  # paste is unmaintained (no known vulnerability). It is a compile-time macro used by
  # Leptos (either_of). Revisit when Leptos replaces it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time dependency of Leptos, no known vulnerability" },
  # rsa: timing side channel in operations with the private key (Marvin attack). ORDO uses
  # rsa only through openidconnect to verify identity providers' RS256 signatures with
  # their public keys; there is no private key that could leak. Revisit when a fix exists.
  { id = "RUSTSEC-2023-0071", reason = "only RSA signature verification with public keys (OIDC ID tokens); no private-key operations" },
  # SQLite before 3.54.0 can return stale memory when it opens a database together with a
  # crafted write-ahead log of another page size. The server opens only its own database in
  # its data volume; whoever can write files there has the server already. The fix needs
  # libsqlite3-sys 0.39, which sqlx 0.9 does not allow yet (< 0.38). Remove this entry as
  # soon as an sqlx release does (Dependabot proposes it).
  { id = "RUSTSEC-2026-0459", reason = "server opens only its own database files; fix blocked until sqlx allows libsqlite3-sys 0.39" },
]

[licenses]
# Only licences compatible with AGPL-3.0-or-later.
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0", # Boost Software License: permissive, GPL-compatible (xxhash-rust via Leptos)
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The list also covers licences of likely future dependencies.
unused-allowed-license = "allow"

[licenses.private]
# ORDO's own crates (publish = false) are AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
