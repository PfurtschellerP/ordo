# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on known security vulnerabilities and on yanked crates.
version = 2
yanked = "deny"
ignore = [
  # paste is unmaintained (no known vulnerability). It is a compile-time macro used by
  # Leptos (either_of). Revisit when Leptos replaces it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time dependency of Leptos, no known vulnerability" },
]

[licenses]
# Only licences compatible with AGPL-3.0-or-later.
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0", # Boost Software License: permissive, GPL-compatible (xxhash-rust via Leptos)
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The list also covers licences of likely future dependencies.
unused-allowed-license = "allow"

[licenses.private]
# ORDO's own crates (publish = false) are AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
