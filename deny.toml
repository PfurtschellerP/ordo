# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on known security vulnerabilities and on yanked crates.
version = 2
yanked = "deny"
# Keep osv-scanner.toml (for OSV-Scanner and the OpenSSF Scorecard) the same.
ignore = [
  # paste is unmaintained (no known vulnerability). It is a compile-time macro used by
  # Leptos (either_of). Revisit when Leptos replaces it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time dependency of Leptos, no known vulnerability" },
  # rsa: timing side channel in operations with the private key (Marvin attack). ORDO uses
  # rsa only through openidconnect to verify identity providers' RS256 signatures with
  # their public keys; there is no private key that could leak. Revisit when a fix exists.
  { id = "RUSTSEC-2023-0071", reason = "only RSA signature verification with public keys (OIDC ID tokens); no private-key operations" },
  # SQLite before 3.54.0 can return stale memory when it opens a database together with a
  # crafted write-ahead log of another page size. The server opens only its own database in
  # its data volume; whoever can write files there has the server already. The fix needs
  # libsqlite3-sys 0.39, which sqlx 0.9 does not allow yet (< 0.38). Remove this entry as
  # soon as an sqlx release does (Dependabot proposes it).
  { id = "RUSTSEC-2026-0459", reason = "server opens only its own database files; fix blocked until sqlx allows libsqlite3-sys 0.39" },
  # chrono is unmaintained since November 2026 (no known vulnerability), and so is humantime,
  # which wraps it. ORDO does not use either; they come with Cedar, openidconnect/oauth2 and
  # object_store (server only). Revisit when those move to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; only via cedar-policy, openidconnect and object_store" },
  { id = "RUSTSEC-2026-0542", reason = "unmaintained because chrono is, no known vulnerability; only via object_store" },
  # Typst, for the handover document on the server (ADR-0089), accepted by the product
  # owner on 2026-11-21 "for now": remove each entry as soon as a Typst release no longer
  # needs it (Dependabot proposes the releases; docs/dependencies.md). quick-xml 0.38 comes
  # with citationberg (bibliographies): its two flaws need XML a template loads itself;
  # ORDO's templates come from reviewed profiles and get only ORDO's own JSON and the
  # patient's photo. The unmaintained crates have no known vulnerability.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via Typst's citationberg; no XML from users reaches it (ADR-0089)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via Typst's citationberg; no XML from users reaches it (ADR-0089)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained but complete; via syntect in Typst, server only" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, no known vulnerability; Typst's shaping, server only" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no known vulnerability; Typst's fonts, server only" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, no known vulnerability; Typst's yaml(), unused by ORDO's templates" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, no known vulnerability; via syntect in Typst, server only" },
]

[licenses]
# Only licences compatible with AGPL-3.0-or-later.
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0", # Boost Software License: permissive, GPL-compatible (xxhash-rust via Leptos)
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The list also covers licences of likely future dependencies.
unused-allowed-license = "allow"

# Mozilla's list of root certificates (data), used by rustls-platform-verifier where the
# system has none of its own. CDLA-Permissive-2.0 puts no conditions on software using it.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# ORDO's own crates (publish = false) are AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
