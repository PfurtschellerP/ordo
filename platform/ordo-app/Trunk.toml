# Build:  cd platform/ordo-app && trunk build --release
# Serve:  ORDO_APP_DIR=platform/ordo-app/dist ordo serve
[build]
target = "index.html"
dist = "dist"

# Before every build: the design-token style sheet (with the contrast check), then the
# licence notices of the shipped crates (LIC-1, ADR-0055; needs cargo-about, else the page
# says they are left out of this build).
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["prebuild.sh"]
