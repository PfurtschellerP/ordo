<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ORDO</title>
    <link data-trunk rel="css" href="generated/ordo-tokens.css">
    <link data-trunk rel="css" href="style/app.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link data-trunk rel="copy-dir" href="icons">
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="sw.js">
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
      // Apply the chosen colour theme before the first paint (no flash of the wrong theme).
      try { const t = localStorage.getItem("ordo.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link data-trunk rel="rust" data-bin="ordo-app" data-cargo-profile="release-wasm" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals">
  </head>
  <body></body>
</html>
