# Colour pairs that must meet WCAG contrast minimums in every theme.
# Checked by `ordo-tokens check`; the results go into the accessibility
# conformance report (requirements A11Y-11).
#
# criterion 1.4.3  = text contrast, minimum 4.5:1 (WCAG 2.2 AA)
# criterion 1.4.11 = non-text contrast (control boundaries, focus, badges), 3:1
#
# Disabled controls are exempt under WCAG and deliberately not listed.

[[pair]]
fg = "color.text.primary"
bg = "color.surface.default"
min = 4.5
criterion = "1.4.3"
purpose = "Body text on default surface"

[[pair]]
fg = "color.text.primary"
bg = "color.surface.raised"
min = 4.5
criterion = "1.4.3"
purpose = "Body text on raised surface"

